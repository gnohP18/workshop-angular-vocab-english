<div class="flex min-h-screen items-center justify-center bg-gray-50 p-6">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg border border-gray-100">
    <h2 class="text-2xl font-semibold text-center text-cyan-600 mb-6">Đăng ký tài khoản</h2>

    <form (ngSubmit)="onSubmit()" [formGroup]="form" class="space-y-5">
      <!-- Họ -->
      <app-validator
        label="Họ"
        [required]="true"
        class="w-full"
        [errorMessage]="errors['firstName']"
      >
        <input
          type="text"
          name="firstName"
          formControlName="firstName"
          required
          placeholder="Nhập tên của bạn"
          class="w-full rounded-lg border border-gray-200 px-4 py-2.5 text-gray-700 placeholder-gray-400 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-100 outline-none transition"
        />
      </app-validator>

      <!-- Tên -->
      <app-validator
        label="Tên"
        [required]="true"
        class="w-full"
        [errorMessage]="errors['lastName']"
      >
        <input
          type="text"
          name="lastName"
          formControlName="lastName"
          required
          placeholder="Nhập họ của bạn"
          class="ve-input-text"
        />
      </app-validator>

      <!-- Email -->
      <app-validator
        label="Email"
        [required]="true"
        class="w-full"
        [errorMessage]="errors['email']"
      >
        <input
          type="email"
          name="email"
          formControlName="email"
          required
          placeholder="you@example.com"
          class="ve-input-text"
        />
      </app-validator>

      <!-- Submit -->
      <button
        type="submit"
        [disabled]="form.invalid"
        class="w-full rounded-lg bg-cyan-500 py-2.5 font-medium text-white shadow-md transition hover:bg-cyan-600 hover:shadow-lg active:scale-95 disabled:opacity-50"
      >
        Đăng ký
      </button>
    </form>

    <p class="mt-5 text-center text-sm text-gray-500">
      Đã có tài khoản?
      <a href="/login" class="text-cyan-500 hover:underline font-medium">Đăng nhập</a>
    </p>
  </div>
</div>
